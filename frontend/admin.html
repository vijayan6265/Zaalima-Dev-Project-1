<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - MiniShop</title>

    <link
        rel="stylesheet"
        href="./admin.css"
    >

</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->

        <aside class="admin-sidebar">

            <div class="admin-logo">
                MiniShop
            </div>

            <nav class="admin-menu">

                <button
                    class="admin-menu-btn active"
                    id="productsMenuBtn"
                    onclick="showSection('products')"
                >
                    📦 Products
                </button>

                <button
                    class="admin-menu-btn"
                    id="ordersMenuBtn"
                    onclick="showSection('orders')"
                >
                    🛒 Orders
                </button>

                <button
                    class="admin-menu-btn"
                    onclick="goHome()"
                >
                    🏠 Store
                </button>

                <button
                    class="admin-menu-btn logout-admin"
                    onclick="logout()"
                >
                    🚪 Logout
                </button>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="admin-main">

            <!-- HEADER -->

            <header class="admin-header">

                <div>

                    <h1 id="pageTitle">
                        Products
                    </h1>

                    <p>
                        Manage your MiniShop
                    </p>

                </div>

                <button
                    class="admin-refresh"
                    onclick="refreshCurrentSection()"
                >
                    ↻ Refresh
                </button>

            </header>


            <!-- PRODUCTS -->

            <section
                id="productsSection"
                class="admin-section"
            >

                <div class="admin-section-header">

                    <h2>
                        Product Management
                    </h2>

                    <button
                        class="add-product-btn"
                        onclick="openAddProduct()"
                    >
                        + Add Product
                    </button>

                </div>


                <div
                    id="productAdminContainer"
                    class="admin-table-wrapper"
                >

                    <div class="loading">
                        Loading products...
                    </div>

                </div>

            </section>


            <!-- ORDERS -->

            <section
                id="ordersSection"
                class="admin-section hidden"
            >

                <div class="admin-section-header">

                    <h2>
                        Order Management
                    </h2>

                </div>


                <div
                    id="orderAdminContainer"
                    class="admin-table-wrapper"
                >

                    <div class="loading">
                        Loading orders...
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- PRODUCT MODAL -->

    <div
        id="productModal"
        class="admin-modal hidden"
    >

        <div class="admin-modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Product
                </h2>

                <button
                    class="modal-close"
                    onclick="closeProductModal()"
                >
                    ×
                </button>

            </div>


            <form id="productForm">

                <input
                    type="hidden"
                    id="productId"
                >


                <div class="admin-form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter product description"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="admin-form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="Enter category"
                        required
                    >

                </div>


                <!-- BRAND -->

                <div class="admin-form-group">

                    <label>
                        Brand
                    </label>

                    <input
                        type="text"
                        id="productBrand"
                        placeholder="Enter brand"
                        required
                    >

                </div>


                <!-- IMAGE URL -->

                <!-- PRODUCT IMAGE -->

                <div class="admin-form-group">

                    <label>
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImageUrl"
                        accept="image/*"
                    >

                    <small>
                        Select JPG, JPEG, PNG, WEBP or GIF image
                    </small>

                </div>


                <!-- STATUS -->

                <div class="admin-form-group">

                    <label>
                        Status
                    </label>

                    <select
                        id="productStatus"
                        required
                    >

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>


                <div class="admin-form-row">

                    <div class="admin-form-group">

                        <label>
                            Price
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="admin-form-group">

                        <label>
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="productQuantity"
                            placeholder="Enter quantity"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <p
                    id="productMessage"
                    class="message"
                ></p>


                <button
                    type="submit"
                    class="save-product-btn"
                    id="saveProductBtn"
                >
                    Save Product
                </button>

            </form>

        </div>

    </div>


    <script
        src="./admin.js"
    ></script>

</body>

</html>
